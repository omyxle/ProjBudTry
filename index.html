<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      width: 300px;
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      background-color: #eee;
    }

    .login-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      background-color: #ea580c;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
      box-sizing: border-box;
    }

    .login-btn:hover {
      background-color: #c2410c;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Log In</h2>

    <label>Username</label>
    <input type="text" placeholder="Demo User" readonly />

    <label>Password</label>
    <input type="password" placeholder="••••••••" readonly />

    <a href="dashboard.html" class="login-btn">Log In</a>
  </div>

</body>
</html>
